<style>

#fl{position:fixed;inset:0;pointer-events:none;opacity:0}

.ab small{display:block;font-weight:400;opacity:.75;font-size:11px}

@keyframes hue{to{background-position:300% 0}}
.sub{line-height:1.6;opacity:.92;margin:6px 0}
.hint{opacity:.7;margin:4px 0}

.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btns button{margin:12px 0 0;font-size:16px;padding:10px 18px}
.sel{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 0}
.sel button{margin:0;padding:8px 16px}
.sel .bot{flex:1;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.sel .bot small{display:block;opacity:.7;font-style:italic;margin-top:2px}
.r{--rc:#5aa8ff;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--rc);border-radius:14px;margin:8px 0;padding:10px 12px;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.01));box-shadow:0 0 14px -3px var(--rc)}
.r>div{flex:1}
.r small{display:block;opacity:.75;font-size:12px;margin-top:2px}
.r em{display:block;font-style:normal;letter-spacing:2px;color:var(--rc);font-size:13px;margin-top:2px}
.r button{margin:0;padding:8px 14px;font-size:14px;flex:none}
.r .bar{width:12px;height:42px;border-radius:6px;flex:none;box-shadow:0 0 12px currentColor}
.r .em{font-size:36px;filter:drop-shadow(0 0 10px var(--rc))}
.r .orb{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:0 0 16px var(--rc),inset -4px -4px 8px rgba(0,0,0,.5)}
/* crates */
.shake{animation:shk .16s infinite alternate;margin:20px 0 6px}
.crate{display:inline-block;font-size:110px;animation:grow 1.4s ease-in forwards}
@keyframes shk{from{transform:rotate(-7deg) translateX(-6px)}to{transform:rotate(7deg) translateX(6px)}}
@keyframes grow{from{transform:scale(.8)}to{transform:scale(1.3)}}
.rvl{position:relative;height:170px;display:flex;align-items:center;justify-content:center}
.rays{position:absolute;width:280px;height:280px;border-radius:50%;background:repeating-conic-gradient(var(--rc) 0 8deg,transparent 8deg 24deg);opacity:.4;-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 68%);mask-image:radial-gradient(circle,#000 15%,transparent 68%);animation:spin 8s linear infinite}

.rvl svg{position:relative;animation:pin .6s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 18px var(--rc))}
@keyframes pin{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.cf{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall var(--d) var(--w) linear forwards;pointer-events:none}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(620px) rotate(720deg)}}
</style></head><body>

function predict(){const p=ball.p.clone(),v=ball.v.clone();let fr=R.front;

 if(ball.held){if(R.server=='b'&&!R.over){R.wait-=dt;if(R.wait<=0)hit('b',(Math.random()*2-1)*W*.66,3.4,13)}}

function playerHit(){if(R.over||R.last==='p'||!R.front)return;

 if(sp){ab[P.k].cd=ab[P.k].max*RK[S.eq].cd;shoot('p',sp,a.x)}else hit('p',a.x,a.y,RK[S.eq].pow)}
function update(dt){
 const dx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),dz=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);

 if(B.swingT>0)B.swingT-=dt;
 botAI(dt);
 if(ball.held){const s=R.server=='p'?P:B;ball.p.set(s.x+.4,1.3,s.z-.3);ball.v.set(0,0,0)}
 else{const e=adv(ball.p,ball.v,dt,ball.moss);
  if(e&1){spark(ball.p.x,ball.p.y,ball.p.z,0xffffff,6,5,.5);fx.position.copy(ball.p);fx.color.set(0xffffff);fx.intensity=2;snd('wall')}
  if(e&32)spark(ball.p.x,ball.p.y,ball.p.z,ballCol,4,3,.4);
  if(e&2)spark(ball.p.x,.1,ball.p.z,0xcfa56a,3,2.5,.4);
  if(!R.over){
   if(e&1){if(e&8)lose(R.last,R.last=='p'?'you hit the tin':'bot hit the tin');else if(e&16)lose(R.last,'out of bounds');else{R.front=true;R.fb=0}}
   if(!R.over&&(e&2)){if(!R.front)lose(R.last,R.last=='p'?'it bounced before the wall':'bot’s shot bounced early');else{R.fb++;if(R.fb>=(ball.moss?3:2))lose(R.last=='p'?'b':'p',R.last=='p'?'bot couldn’t return it':'you missed it')}}}}
 if(R.over){R.wait-=dt;if(R.wait<=0){if(sc.p>=5||sc.b>=5)endMatch();else serve(R.winner)}}}
